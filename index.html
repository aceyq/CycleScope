<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CycleScope - Exploring bike activity through interactive maps" />
    <title>CycleScope - Bike Activity Maps</title>

    <!-- Preload important resources -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    
    <!-- Styles -->
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    
    <!-- Mapbox GL JS CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <h1>🚴🏼‍♀️ CycleScope</h1>
      <p>Exploring bike activity through maps.</p>
    </header>

    <main>
      <!-- Map container + SVG overlay -->
      <div id="map" role="application" aria-label="Interactive bike map of Boston and Cambridge area">
        <svg aria-hidden="true"></svg>
      </div>
    </main>

    <!-- JS (ES modules) - Load at end of body for better performance -->
    <script src="map.js?v=3" type="module"></script>
  </body>
</html>
