<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <!-- Mapbox GL JS CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <h1>🚴🏼‍♀️ Bikewatching</h1>
      <label>
        Filter by time:
        <input type="range" id="time-slider" min="-1" max="1440" value="-1">
        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
      </label>
    </header>
    <div id="loading">Loading traffic data... This may take a minute</div>
    <div id="map">
      <svg></svg>
    </div>
    <div class="legend">
      <div class="legend-title">Traffic Flow:</div>
      <div class="legend-item" style="--departure-ratio: 1">
        <span class="swatch"></span>
        <span class="label">More departures</span>
      </div>
      <div class="legend-item" style="--departure-ratio: 0.5">
        <span class="swatch"></span>
        <span class="label">Balanced</span>
      </div>
      <div class="legend-item" style="--departure-ratio: 0">
        <span class="swatch"></span>
        <span class="label">More arrivals</span>
      </div>
    </div>
    <script src="map.js" type="module"></script>
  </body>
</html>
